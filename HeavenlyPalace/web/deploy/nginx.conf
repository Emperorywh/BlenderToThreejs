# 将 web/dist 的全部内容放入下方站点根目录。
# 此配置放在 NGINX 的 http 上下文内，按实际域名和目录调整。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 页面入口和场景文件使用协商缓存，发布后能及时取得新内容。
    # 本站无客户端路径路由，缺失文件返回正常的静态文件错误码。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # 构建脚本和样式的文件名带摘要，内容变化时地址也会变化。
    # 此缓存规则只针对页面构建文件，不套用到固定名称的场景文件。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 对页面文本启用传输压缩，模型与图片继续使用原有编码。
    # 静态站点运行不需要反向代理或额外应用服务。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
